name: Release

# Tags publish. Pull requests and manual runs perform the checks without
# uploading, so a release that would fail is rejected before the tag.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
        with:
          install_args: node

      - name: Every environment this workflow names exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environments="$(yq '.jobs[].environment | select(. != null) | (.name // .)' .github/workflows/publish.yml)"
          for environment in ${environments}; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}" --silent; then
              echo "Environment '${environment}' does not exist in ${GITHUB_REPOSITORY}. Create it in Settings, Environments." >&2
              exit 1
            fi
          done

      # Fork and Dependabot pull requests cannot read repository secrets.
      - name: npm can publish the package
        if: >-
          ${{ github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
        run: |
          package="$(node -p "require('./package.json').name")"
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            if [ "${TRUSTED_PUBLISHER}" != "true" ]; then
              echo "No way to authenticate to npm. Add the NPM_AUTH_TOKEN secret, or set up the trusted publisher and set the NPM_TRUSTED_PUBLISHER variable to true, see .github/contributing.md." >&2
              exit 1
            fi
            echo "Publishing uses the trusted publisher. npm offers no way to check it before a publish."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${RUNNER_TEMP}/.npmrc"
          export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          if ! user="$(npm whoami --registry https://registry.npmjs.org)"; then
            echo "NPM_AUTH_TOKEN is not accepted by npm. Create a new token." >&2
            exit 1
          fi
          if ! collaborators="$(npm access list collaborators "${package}" --json --registry https://registry.npmjs.org)"; then
            echo "NPM_AUTH_TOKEN cannot read the access list of ${package}, so it cannot publish it." >&2
            exit 1
          fi
          if [ "$(jq -r --arg user "${user}" '.[$user] // ""' <<< "${collaborators}")" != "read-write" ]; then
            echo "${user} has no write access to ${package}, or NPM_AUTH_TOKEN is scoped away from it." >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5

      - run: bun install --frozen-lockfile

      - name: Version matches the tag and the release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          package="$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '')")"
          expected="${package} ${version} is out."
          first="$(head -n 1 .github/release-notes.md)"
          if [ "$first" != "$expected" ]; then
            echo "First line of .github/release-notes.md is '${first}', expected '${expected}'" >&2
            exit 1
          fi

      - name: npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm ${npm_version} cannot publish with OIDC, 11.5.1 or later is needed" >&2
            exit 1
          fi

      - run: bun run check

      - name: Pack the package
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
        with:
          install_args: node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # npm uses trusted publishing when configured and otherwise uses the
      # token.
      - name: Publish to npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${RUNNER_TEMP}/.npmrc"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          fi
          npm publish package/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  release:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
