name: Publish to npm

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5

      - run: bun install --frozen-lockfile

      - name: Release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Release notes announce this version
        run: |
          package="$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '')")"
          expected="${package} ${GITHUB_REF_NAME#v} is out."
          first="$(head -n 1 .github/release-notes.md)"
          if [ "$first" != "$expected" ]; then
            echo "First line of .github/release-notes.md is '${first}', expected '${expected}'" >&2
            exit 1
          fi

      - run: bun run check

      - run: bun run build

      # The prepack script builds the package before publishing.
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${RUNNER_TEMP}/.npmrc"
          npm publish --userconfig "${RUNNER_TEMP}/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
