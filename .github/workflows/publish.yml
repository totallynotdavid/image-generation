name: Release

# Tags publish. Pull requests and manual runs perform the checks without
# uploading, so a release that would fail is rejected before the tag.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          install_args: node

      - name: Every environment this workflow names exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environments="$(yq '.jobs[].environment | select(. != null) | (.name // .)' .github/workflows/publish.yml)"
          for environment in ${environments}; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}" --silent; then
              echo "Environment '${environment}' does not exist in ${GITHUB_REPOSITORY}. Create it in Settings, Environments." >&2
              exit 1
            fi
          done

      - name: The version is not on npm yet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # npm view prints the version when it is published and fails with
          # E404 when it is not. Any other failure is a real error.
          published=""
          if ! published="$(npm view "${package}@${version}" version 2> "${RUNNER_TEMP}/npm-view.log")" &&
            ! grep -q E404 "${RUNNER_TEMP}/npm-view.log"; then
            cat "${RUNNER_TEMP}/npm-view.log" >&2
            exit 1
          fi
          if [ -n "${published}" ]; then
            echo "${package}@${published} is already on npm. Bump version in package.json." >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5

      - run: bun install --frozen-lockfile

      - name: Version matches the tag and the release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          package="$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '')")"
          expected="${package} ${version} is out."
          first="$(head -n 1 .github/release-notes.md)"
          if [ "$first" != "$expected" ]; then
            echo "First line of .github/release-notes.md is '${first}', expected '${expected}'" >&2
            exit 1
          fi

      - run: bun run check

      - name: Pack the package
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout must precede mise because mise reads the pinned Node version from mise.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          install_args: node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm ${npm_version} cannot publish with OIDC, 11.5.1 or later is needed" >&2
            exit 1
          fi

      # npm authenticates through the trusted publisher, with no stored token.
      # The ./ prefix makes package/<file> a local tarball path.
      - name: Publish to npm
        run: |
          dry_run=()
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            dry_run=(--dry-run)
          fi
          npm publish "${dry_run[@]}" ./package/*.tgz

  release:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
