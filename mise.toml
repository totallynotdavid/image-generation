[tools]
bun = "1.4.3"
node = "26.11.1"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint with oxlint and check formatting of code, Markdown, YAML and JSON with oxfmt"
run = ["bunx oxlint --deny-warnings", "bunx oxfmt --check"]

[tasks.fix]
description = "Apply oxlint safe fixes and format with oxfmt"
run = ["bunx oxlint --fix", "bunx oxfmt"]

[tasks.typecheck]
description = "Type-check sources, tests and the example with tsc"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the vitest suite with coverage"
run = "bunx vp test run --coverage"

[tasks.build]
description = "Build dist, check the package with publint and attw, and import the packed tarball"
run = ["bunx vp pack", "node scripts/smoke.mjs"]

[tasks.check]
description = "Run lint, typecheck, test and build without writing tracked files"
depends = ["lint", "typecheck", "test", "build"]

[tasks.example]
description = "Run the example script that writes images to example/output"
run = "bun example/main.ts"
