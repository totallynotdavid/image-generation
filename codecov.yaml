comment:
  layout: "condensed_header, diff, flags, components, condensed_files, condensed_footer"
  behavior: default
  require_base: true
  require_head: true
  hide_project_coverage: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - "!master"
  individual_components:
    - component_id: transforms
      name: Transforms
      paths:
        - src/transforms/**
      statuses:
        - type: project
          target: auto
        - type: patch
          target: auto

    - component_id: core
      name: Core
      paths:
        - src/*.ts
